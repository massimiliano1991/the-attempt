<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricevuto — Vera</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://theattempt.org/vera/lavori/grazie.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23a3482a'/%3E%3Cpath d='M4 4.5l4 7 4-7' fill='none' stroke='%23fbf8f2' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--paper:#f4efe6;--card:#fffdf9;--ink:#1d1a17;--muted:#57524b;--rule:#e1d9cc;--accent:#a3482a;--accent-ink:#fff;--accent-soft:#f6e5dc;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#171513;--card:#211e1b;--ink:#efe9df;--muted:#b4ada2;--rule:#36312c;--accent:#e07a55;--accent-ink:#1a0f0a;--accent-soft:#3a251c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.55;padding:24px 16px;-webkit-font-smoothing:antialiased}
main{max-width:30em;width:100%;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:32px 24px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 48px -32px rgba(29,26,23,.35)}
@media (min-width:600px){main{padding:40px 36px}}
p{margin:0 0 16px;color:var(--muted);text-wrap:pretty}
p.forte{color:var(--ink);font-size:20px}
a{color:var(--accent);text-underline-offset:.18em}
p a{padding-block:12px}
.spunta{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 0 18px}
.spunta svg{width:30px;height:30px;display:block}
.spunta path{stroke-dasharray:30;stroke-dashoffset:0}
h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;font-weight:400;font-size:clamp(32px,8vw,42px);line-height:1.1;letter-spacing:-.01em;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:14px 28px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;margin-top:4px;border:2px solid var(--accent);
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 24px -12px var(--accent);transition:transform .15s ease,filter .15s ease,box-shadow .15s ease}
.btn:hover{filter:brightness(1.07);box-shadow:0 1px 2px rgba(0,0,0,.06),0 14px 28px -12px var(--accent)}
.btn:active{transform:scale(.98);box-shadow:0 1px 2px rgba(0,0,0,.06)}
@media (max-width:420px){.btn{width:100%}}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* l'arrivo: la scheda sale, poi il segno si disegna; solo per chi accetta il movimento */
@media (prefers-reduced-motion:no-preference){
  main{animation:arrivo .5s cubic-bezier(.2,.7,.2,1) both}
  .spunta{animation:cerchio .4s cubic-bezier(.2,.7,.2,1) .15s both}
  .spunta path{stroke-dashoffset:30;animation:traccia .45s cubic-bezier(.4,0,.2,1) .4s forwards}
  @keyframes arrivo{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes cerchio{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @keyframes traccia{to{stroke-dashoffset:0}}
}
</style>
</head>
<body>
<main>
  <div class="spunta" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
  <h1>Ricevuto.</h1>
  <p class="forte">Entro 24 ore ti scrivo, con il tuo codice e le domande che servono.</p>
  <p>Se vuoi aggiungere qualcosa, anche una foto, scrivi a <a href="mailto:vera@theattempt.org">vera@theattempt.org</a>.</p>
  <a class="btn" href="/vera/lavori/">← Torna ai lavori</a>
</main>
<img src="https://theattempt.goatcounter.com/count?p=/vera/lavori/grazie" width="1" height="1" alt="" aria-hidden="true" style="position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none">
</body>
</html>
