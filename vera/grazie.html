<!-- STILE: inizio (mente/bellezza/vera.css via bellezza/vera_stile.py: non si tocca a mano) -->
<style>
:root{
  --paper:#f4efe6;
  --card:#fffdf9;
  --ink:#1d1a17;
  --muted:#57524b;
  --faint:#7a746b;
  --rule:#e1d9cc;
  --accent:#a3482a;
  --accent-ink:#ffffff;
  --accent-fill:var(--accent);
  --accent-soft:#f6e5dc;
  --band:#2b2723;
  --band-ink:#f4efe6;
  --ok:#3f6b3a;
  --warn:#8a5a12;
  --warn-soft:#f8ecd5;
  --bad:#b3261e;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  --anello:color-mix(in srgb,var(--accent) 24%,transparent);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#171513;--card:#211e1b;--ink:#efe9df;--muted:#b4ada2;--faint:#8d867c;--rule:#36312c;
        --accent:#d38b59;--accent-fill:#a54a24;--accent-ink:#f6efe6;--accent-soft:#33241b;--band:#0d0c0b;--band-ink:#efe9df;
        --ok:#8cc084;--warn:#e2b25c;--warn-soft:#33281a;--bad:#f28b7d;color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;
     -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{display:block}
a{color:var(--accent);text-underline-offset:.18em}
p,dd,li{text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:14px 28px;border-radius:999px;
     font-size:17px;font-weight:600;text-decoration:none;border:2px solid var(--accent);cursor:pointer;font-family:inherit;
     transition:transform .15s ease,filter .15s ease,box-shadow .15s ease,background-color .15s ease}
.btn:active{transform:scale(.98)}
.btn-main{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 24px -12px var(--accent)}
.btn-main:hover{filter:brightness(1.07);box-shadow:0 1px 2px rgba(0,0,0,.06),0 14px 28px -12px var(--accent)}
@media (prefers-color-scheme:dark){.btn-main,.btn-main:hover{box-shadow:0 1px 2px rgba(0,0,0,.35)}}
.btn-main:active{box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn[disabled]{opacity:.7;cursor:progress;transform:none}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-ghost:hover{background:var(--accent-soft)}
.cta{display:flex;flex-wrap:wrap;gap:12px}
@media (max-width:420px){.cta .btn{flex:1 1 100%}}
</style>
<!-- STILE: fine -->
<style>
body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;font-size:18px;padding:24px 16px}
main{max-width:30em;width:100%;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:32px 24px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 48px -32px rgba(29,26,23,.35)}
@media (min-width:600px){main{padding:40px 36px}}
p{margin:0 0 16px;color:var(--muted)}
p.forte{color:var(--ink);font-size:20px}
p a{padding-block:12px}
.spunta{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 0 18px}
.spunta svg{width:30px;height:30px}
.spunta path{stroke-dasharray:30;stroke-dashoffset:0}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,8vw,42px);line-height:1.1;letter-spacing:-.01em;margin:0 0 12px}
.btn{margin-top:4px}
@media (max-width:420px){.btn{width:100%}}
/* l'arrivo: la scheda sale, poi il segno si disegna; solo per chi accetta il movimento */
@media (prefers-reduced-motion:no-preference){
  main{animation:arrivo .45s cubic-bezier(.2,.7,.2,1) both}
  .spunta{animation:cerchio .4s cubic-bezier(.2,.7,.2,1) .15s both}
  .spunta path{stroke-dashoffset:30;animation:traccia .45s cubic-bezier(.4,0,.2,1) .4s forwards}
  @keyframes arrivo{from{opacity:.4;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes cerchio{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @keyframes traccia{to{stroke-dashoffset:0}}
}
</style>
</head>
<body>
<main>
  <div class="spunta" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
  <h1>Ricevuto.</h1>
  <p class="forte">Ti rispondo entro 24 ore, per iscritto.</p>
  <p>Se vuoi aggiungere qualcosa, scrivi a <a href="mailto:vera@veradiade.com">vera@veradiade.com</a>.</p>
  <a class="btn btn-main" href="/vera/">← Torna a Vera</a>
</main>
<img src="https://theattempt.goatcounter.com/count?p=/vera/grazie" width="1" height="1" alt="" aria-hidden="true" style="position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none">
</body>
</html>
