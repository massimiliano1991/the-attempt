<style>
:root{--paper:#f4efe6;--card:#fffdf9;--ink:#1d1a17;--muted:#57524b;--rule:#e1d9cc;--accent:#a3482a;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#171513;--card:#211e1b;--ink:#efe9df;--muted:#b4ada2;--rule:#36312c;--accent:#e07a55;--accent-ink:#1a0f0a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);

main{max-width:30em;width:100%;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:32px 24px}
svg{width:44px;height:44px;color:var(--accent);margin:0 0 16px}
h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.1;margin:0 0 12px}
p{margin:0 0 16px;color:var(--muted)}
a{color:var(--accent);text-underline-offset:.18em}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:10px 20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;margin-top:4px}

<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
